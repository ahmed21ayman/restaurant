 deploying a Vite React app to GitHub Pages
name: Deploy Vite app to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- ADDED: Set up Node.js so we can run npm commands ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- ADDED: Install your project dependencies ---
      - name: Install dependencies
        run: npm install
        working-directory: ./food-order

      # --- ADDED: Build the Vite project into static HTML/JS/CSS ---
      - name: Build project
        run: npm run build
        working-directory: ./food-order

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # --- CHANGED: Tell GitHub to upload the 'dist' folder Vite creates ---
          path: './food-order/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
